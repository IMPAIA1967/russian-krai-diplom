<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ресторан "Русский Край"{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Шапка сайта -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="{% url 'index' %}" class="logo">🍽️ Русский Край</a>
                <ul class="nav-menu">
                    <li><a href="{% url 'index' %}">Главная</a></li>
                    <li><a href="{% url 'menu' %}">Меню</a></li>
                    <li><a href="{% url 'reservation' %}">Бронирование</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал сайта -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Ресторан "Русский Край". Все права защищены.</p>
            <p>📞 +7 (999) 000-00-00 | 📍 ул. Примерная, д. 1</p>
        </div>
    </footer>
</body>
</html>
