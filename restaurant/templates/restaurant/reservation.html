{% extends 'restaurant/base.html' %}

{% block title %}Бронирование - Ресторан "Русский Край"{% endblock %}

{% block content %}
<div class="container">
    <h2 style="font-family: 'Playfair Display', serif; font-size: 36px; text-align: center; margin-bottom: 40px;">Забронировать столик</h2>
    
    <form class="reservation-form" method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="guest_name">Ваше имя *</label>
            <input type="text" id="guest_name" name="guest_name" required placeholder="Иван Иванов">
        </div>
        
        <div class="form-group">
            <label for="guest_phone">Телефон *</label>
            <input type="tel" id="guest_phone" name="guest_phone" required placeholder="+7 (999) 000-00-00">
        </div>
        
        <div class="form-group">
            <label for="guest_email">Email *</label>
            <input type="email" id="guest_email" name="guest_email" required placeholder="email@example.com">
        </div>
        
        <div class="form-group">
            <label for="reservation_date">Дата *</label>
            <input type="date" id="reservation_date" name="reservation_date" required>
        </div>
        
        <div class="form-group">
            <label for="reservation_time">Время *</label>
            <input type="time" id="reservation_time" name="reservation_time" required>
        </div>
        
        <div class="form-group">
            <label for="guests_count">Количество гостей *</label>
            <select id="guests_count" name="guests_count" required>
                <option value="1">1 гость</option>
                <option value="2" selected>2 гостя</option>
                <option value="3">3 гостя</option>
                <option value="4">4 гостя</option>
                <option value="5">5 гостей</option>
                <option value="6">6 гостей</option>
                <option value="8">7-8 гостей</option>
                <option value="10">9-10 гостей</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="special_requests">Особые пожелания</label>
            <textarea id="special_requests" name="special_requests" placeholder="Например: день рождения, аллергия на орехи..."></textarea>
        </div>
        
        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Забронировать</button>
    </form>
</div>
{% endblock %}
